<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Formulaire de détection pour Netlify Forms (non affiché sur le site). Les champs doivent correspondre à LeadForm.tsx. -->
    <form name="proprietaires" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="proprietaires" />
      <input type="text" name="company" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="city" />
      <input type="text" name="property_type" />
      <textarea name="message"></textarea>
      <input type="hidden" name="locale" />
      <input type="hidden" name="page" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />
      <input type="hidden" name="utm_term" />
      <input type="hidden" name="gclid" />
    </form>
  </body>
</html>
